name: Build Xeno-Koi Windows Release

on:
  push:
    branches: [ main ]
  pull_request:
  workflow_dispatch:

concurrency:
  group: windows-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-windows:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install MinGW Cross-Compiler
        run: |
          CODENAME=$(. /etc/os-release && echo "$VERSION_CODENAME")
          sudo rm -f /etc/apt/sources.list /etc/apt/sources.list.d/*
          printf 'deb https://mirrors.edge.kernel.org/ubuntu %s main universe\ndeb https://mirrors.edge.kernel.org/ubuntu %s-updates main universe\n' "$CODENAME" "$CODENAME" | sudo tee /etc/apt/sources.list >/dev/null
          sudo apt-get -o Acquire::Languages=none -o Acquire::Retries=3 update
          sudo apt-get -o Acquire::Retries=3 install -y --no-install-recommends gcc-mingw-w64-x86-64 zip

      - name: Download Raylib 5.5 for Windows
        run: |
          curl -sL -o raylib_win.zip https://github.com/raysan5/raylib/releases/download/5.5/raylib-5.5_win64_mingw-w64.zip
          unzip -q raylib_win.zip
          mkdir -p raylib_win
          mv raylib-5.5_win64_mingw-w64/* raylib_win/

      - name: Compile Windows Executable
        run: |
          mkdir -p dist/assets
          x86_64-w64-mingw32-gcc -std=c99 -O2 src/*.c \
            -Iraylib_win/include \
            raylib_win/lib/libraylib.a \
            -lopengl32 -lgdi32 -lwinmm -static -mwindows \
            -o dist/KoiKoi.exe
          cp -rf assets/* dist/assets/
          [ -f settings.txt ] && cp settings.txt dist/ || true

      - name: Package Release ZIP
        run: |
          cd dist
          zip -r ../XenoKoi_Windows.zip ./*

      - name: Upload Windows Build Artifact
        uses: actions/upload-artifact@v4
        with:
          name: XenoKoi_Windows
          path: XenoKoi_Windows.zip
