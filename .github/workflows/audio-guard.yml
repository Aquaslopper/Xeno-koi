name: Audio guard

# Fails the PR if src/ui_audio.c no longer matches the recorded release hash.
# A change to the audio DSP is therefore never silent: it must arrive together
# with an updated tools/audio_guard.sha256, in the same diff, where it is visible.

on:
  pull_request:
  push:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  audio-guard:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Verify src/ui_audio.c against the recorded release hash
        run: ./tools/audio_guard.sh

      - name: Explain a failure
        if: failure()
        run: |
          echo "::error file=src/ui_audio.c::src/ui_audio.c does not match tools/audio_guard.sha256."
          echo "If the change is intended, run './tools/audio_guard.sh --record'"
          echo "and commit the updated tools/audio_guard.sha256 with the change."
          exit 1
