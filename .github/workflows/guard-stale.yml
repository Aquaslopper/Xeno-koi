name: Guard stale protected revert

# Fails a pull request whose branch base predates protected changes that landed
# on main: such a branch risks dropping the newer rules/scoring/combo/cards/docs
# work when it is merged or when conflicts are resolved. The guard lists the
# protected files that changed on main since the branch's merge base.
# See docs/reference/protected-mechanics.md.
#
# Two triggers, on purpose:
#
#   * pull_request_target — the base-branch copy of this workflow and of
#     tools/guard_stale.sh (trusted) with a read/write token; produces the
#     required check name "stale". It checks out the reviewed base commit and
#     only reads git objects, never pull request code.
#   * pull_request — reports "stale-preview" from the pull request's own tree
#     (untrusted, informational only, never satisfies the required check).

on:
  pull_request:
    branches: [main]
  pull_request_target:
    branches: [main]

permissions:
  contents: read
  pull-requests: write

jobs:
  stale:
    # The trusted event gets the required check name "stale"; the PR-owned copy
    # of this workflow only ever reports "stale-preview".
    name: ${{ github.event_name == 'pull_request_target' && 'stale' || 'stale-preview' }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout reviewed base commit (trusted run, never the PR head)
        if: github.event_name == 'pull_request_target'
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.base.sha }}
          fetch-depth: 0

      - name: Checkout pull request tree (preview run, untrusted)
        if: github.event_name == 'pull_request'
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Compare protected files against main
        id: stale
        env:
          PR_NUMBER: ${{ github.event.pull_request.number }}
          PR_AUTHOR: ${{ github.event.pull_request.user.login }}
          OWNER_LOGIN: Aquaslopper
          EVENT_NAME: ${{ github.event_name }}
          BASE_REPO: ${{ github.repository }}
          HEAD_REPO: ${{ github.event.pull_request.head.repo.full_name }}
          MAIN_REF: origin/main
        run: |
          if [ -f tools/guard_stale.sh ]; then
            bash tools/guard_stale.sh
          elif [ "$EVENT_NAME" = "pull_request_target" ]; then
            echo "::error::tools/guard_stale.sh is missing from the reviewed base commit — the guard cannot run."
            echo "stale=true" >> "$GITHUB_OUTPUT"
          else
            echo "::notice::tools/guard_stale.sh is missing from this pull request — preview audit skipped."
            echo "stale=false" >> "$GITHUB_OUTPUT"
            echo "comment=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Sticky comment (stale branch)
        if: steps.stale.outputs.comment == 'true'
        uses: marocchino/sticky-pull-request-comment@v2
        with:
          header: ${{ steps.stale.outputs.comment_header }}
          path: ${{ steps.stale.outputs.body }}

      - name: Fail on a stale protected branch
        if: steps.stale.outputs.stale == 'true'
        env:
          STALE_FILES: ${{ steps.stale.outputs.files }}
        run: |
          echo "Protected files changed on main since this branch was based on it:"
          printf '%s\n' "$STALE_FILES" | tr ' ' '\n' | sed '/^$/d'
          echo "::error::Stale branch — merging as-is risks reverting protected mechanics. Merge or rebase origin/main."
          exit 1
