name: Guard stale protected revert
on:
  pull_request:
    branches: [main]
  pull_request_target:
    branches: [main]
permissions:
  contents: read
  pull-requests: write
jobs:
  stale:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout base
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Checkout PR head (fork-safe)
        run: |
          if [ "${{ github.event_name }}" = "pull_request_target" ]; then
            git fetch origin pull/${{ github.event.pull_request.number }}/head:pr-${{ github.event.pull_request.number }}
            git checkout pr-${{ github.event.pull_request.number }}
          fi
      - name: Fetch main
        run: git fetch origin main
      - name: Check protected changed on main since base
        id: check
        run: |
          BASE=$(git merge-base HEAD origin/main)
          CHANGED=$(git diff --name-only $BASE..origin/main -- src/rules.* src/engine.* src/cards.* src/campaign.* src/storage.* src/ai.* docs/rulesets/ docs/scoring/ docs/assets/cards/ assets/atlas.png assets/atlas_deus.png tools/wiki_tables.c tools/test_koikoi_trigger.c tools/make_card_images.py mkdocs.yml | sort -u)
          if [ -n "$CHANGED" ]; then
            echo "stale=true" >> $GITHUB_OUTPUT
            echo "$CHANGED" > /tmp/stale.txt
            {
              echo "### ⚠️ Stale branch — would revert protected mechanics"
              echo "Base: \`$BASE\` — protected changed on main since then:"
              echo '```'
              cat /tmp/stale.txt
              echo '```'
            } > /tmp/body.md
          else
            echo "stale=false" >> $GITHUB_OUTPUT
          fi
      - name: Comment
        if: steps.check.outputs.stale == 'true'
        uses: marocchino/sticky-pull-request-comment@v2
        with:
          header: guard-stale
          path: /tmp/body.md
      - name: Fail if stale
        if: steps.check.outputs.stale == 'true'
        run: |
          echo "::error::Stale branch would revert protected files"
          cat /tmp/stale.txt
          exit 1
