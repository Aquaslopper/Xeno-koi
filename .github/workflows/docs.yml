name: Docs & Web Build

on:
  push:
    branches: [ main ]
    paths:
      - 'docs/**'
      - 'mkdocs.yml'
      - 'tools/**'
      - 'src/**'
      - 'assets/**'
      - 'web/**'
      - 'tests/**'
      - 'build.sh'
      - '.github/workflows/docs.yml'
  pull_request:
    branches: [ main ]
    paths:
      - 'docs/**'
      - 'mkdocs.yml'
      - 'tools/**'
      - 'src/**'
      - 'assets/**'
      - 'web/**'
      - 'tests/**'
      - 'build.sh'
      - '.github/workflows/docs.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Run engine integrity tests
        run: ./build.sh test

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install MkDocs Material
        run: pip install "mkdocs-material>=9,<10"

      - name: Check generated tables match the engine source
        run: python3 tools/gen_wiki_tables.py --check

      - name: Build wiki site at root (strict)
        run: mkdocs build --strict --site-dir site

      - name: Set up Emscripten SDK
        uses: mymindstorm/setup-emsdk@v14
        with:
          version: '3.1.64'
          actions-cache-folder: 'emsdk-cache'

      - name: Cache Raylib 5.5 for PLATFORM_WEB
        uses: actions/cache@v4
        with:
          path: /tmp/raylib_web_cache
          key: raylib-5.5-wasm-3.1.64

      - name: Compile Raylib 5.5 (PLATFORM_WEB)
        run: |
          if [ ! -f /tmp/raylib_web_cache/libraylib.a ]; then
            git clone --depth 1 --branch 5.5 https://github.com/raysan5/raylib.git /tmp/raylib_repo
            make -C /tmp/raylib_repo/src PLATFORM=PLATFORM_WEB -B -j$(nproc)
            mkdir -p /tmp/raylib_web_cache/src
            cp -r /tmp/raylib_repo/src/*.h /tmp/raylib_web_cache/src/
            cp /tmp/raylib_repo/src/libraylib.a /tmp/raylib_web_cache/libraylib.a
          fi
          mkdir -p /tmp/raylib/src
          cp -r /tmp/raylib_web_cache/src/* /tmp/raylib/src/
          cp /tmp/raylib_web_cache/libraylib.a /tmp/libraylib_web.a

      - name: Run table UI regression tests (headless)
        run: ./tests/test_table_ui.sh

      - name: Run audio DSP regression tests (headless)
        run: ./tests/test_audio_dsp.sh

      - name: Build WebAssembly bundle into /play/
        run: |
          ./build.sh wasm
          mkdir -p site/play
          cp -r dist/web/* site/play/

      - name: Package playable web archive
        run: |
          cd dist/web
          zip -r ../XenoKoi-Web.zip .

      - name: Upload playable web zip artifact
        uses: actions/upload-artifact@v4
        with:
          name: XenoKoi-Web
          path: dist/XenoKoi-Web.zip

      - name: Upload Pages artifact (wiki at / and web build at /play/)
        if: github.ref == 'refs/heads/main'
        uses: actions/upload-pages-artifact@v3
        with:
          path: site

  deploy:
    if: github.ref == 'refs/heads/main' && (github.event_name == 'push' || github.event_name == 'workflow_dispatch')
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
