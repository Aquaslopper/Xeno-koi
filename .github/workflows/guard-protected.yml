name: Guard protected mechanics
on:
  pull_request:
    branches: [main]
  pull_request_target:
    branches: [main]
permissions:
  contents: read
  pull-requests: write
jobs:
  guard:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout base
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Checkout PR head (fork-safe)
        run: |
          if [ "${{ github.event_name }}" = "pull_request_target" ]; then
            git fetch origin pull/${{ github.event.pull_request.number }}/head:pr-${{ github.event.pull_request.number }}
            git checkout pr-${{ github.event.pull_request.number }}
          fi
      - name: Detect protected file changes
        id: filter
        uses: dorny/paths-filter@v3
        with:
          base: ${{ github.event.pull_request.base.sha }}
          list-files: shell
          filters: |
            rules:
              - 'src/rules.*'
              - 'src/engine.*'
              - 'src/cards.*'
              - 'tools/wiki_tables.c'
              - 'tools/test_koikoi_trigger.c'
              - 'docs/rulesets/**'
              - 'docs/scoring/**'
            settings:
              - 'src/campaign.*'
              - 'src/storage.*'
              - 'src/ai.*'
            cards_atlas:
              - 'assets/atlas.png'
              - 'assets/atlas_deus.png'
              - 'assets/back.png'
              - 'assets/deus.png'
              - 'assets/*.jpg'
              - 'docs/assets/cards/**'
              - 'docs/assets/deus-bg.webp'
              - 'tools/make_card_images.py'
            wiki:
              - 'docs/**'
              - 'mkdocs.yml'
              - 'overrides/**'
            core_mechanic:
              - 'src/ui_screens.c'
              - 'src/ui_board_status.c'
              - 'src/board_layout.*'
              - 'src/rules.c'
              - 'src/engine.c'
      - name: Build summary
        id: summary
        if: steps.filter.outputs.rules == 'true' || steps.filter.outputs.settings == 'true' || steps.filter.outputs.cards_atlas == 'true' || steps.filter.outputs.wiki == 'true' || steps.filter.outputs.core_mechanic == 'true'
        run: |
          echo "protected=true" >> $GITHUB_OUTPUT
          {
            echo "### ⚠️ Protected areas touched"
            if [ "${{ steps.filter.outputs.rules }}" == "true" ]; then echo "**Rules:**"; echo '```'; echo "${{ steps.filter.outputs.rules_files }}"; echo '```'; fi
            if [ "${{ steps.filter.outputs.settings }}" == "true" ]; then echo "**Settings:**"; echo '```'; echo "${{ steps.filter.outputs.settings_files }}"; echo '```'; fi
            if [ "${{ steps.filter.outputs.cards_atlas }}" == "true" ]; then echo "**Cards/Atlas:**"; echo '```'; echo "${{ steps.filter.outputs.cards_atlas_files }}"; echo '```'; fi
            if [ "${{ steps.filter.outputs.wiki }}" == "true" ]; then echo "**Wiki:**"; echo '```'; echo "${{ steps.filter.outputs.wiki_files }}"; echo '```'; fi
            if [ "${{ steps.filter.outputs.core_mechanic }}" == "true" ]; then echo "**Core:**"; echo '```'; echo "${{ steps.filter.outputs.core_mechanic_files }}"; echo '```'; fi
          } > /tmp/body.md
      - name: Comment
        if: steps.summary.outputs.protected == 'true' && github.actor != 'Aquaslopper'
        uses: marocchino/sticky-pull-request-comment@v2
        with:
          header: guard-protected
          path: /tmp/body.md
      - name: Fail if protected by non-owner
        if: steps.summary.outputs.protected == 'true' && github.actor != 'Aquaslopper'
        run: |
          echo "::error::Protected mechanics changed by non-owner"
          exit 1
        if: steps.summary.outputs.protected != 'true' || github.actor == 'Aquaslopper'
        run: echo "No protected changes by non-owner, or owner bypass — OK"
