name: Guard protected mechanics

# Enforcement for the protected zones listed in .github/CODEOWNERS and
# AGENTS.md — see docs/reference/protected-mechanics.md.
#
# Two triggers, on purpose:
#
#   * pull_request_target — GitHub runs the copy of this workflow that lives on
#     the base branch (trusted) with a read/write token. This is the run that
#     produces the required check name "guard", and the only one that may block
#     a merge. It checks out the reviewed base commit and never the pull request
#     head, so no code from a fork is executed or modified. It also posts the
#     sticky comment on fork pull requests.
#   * pull_request — reports "guard-preview" from the pull request's own tree
#     (the workflow file and the script come from the pull request, so the run
#     is untrusted and informational only). It gives contributors feedback
#     before the trusted run finishes and can never satisfy the required check:
#     editing the guard in a fork cannot switch enforcement off.

on:
  pull_request:
    branches: [main]
  pull_request_target:
    branches: [main]

permissions:
  contents: read
  pull-requests: write

jobs:
  guard:
    # The trusted event gets the required check name "guard"; the PR-owned copy
    # of this workflow only ever reports "guard-preview".
    name: ${{ github.event_name == 'pull_request_target' && 'guard' || 'guard-preview' }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout reviewed base commit (trusted run, never the PR head)
        if: github.event_name == 'pull_request_target'
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.base.sha }}
          fetch-depth: 0

      - name: Checkout pull request tree (preview run, untrusted)
        if: github.event_name == 'pull_request'
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Audit protected mechanics
        id: guard
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          PR_AUTHOR: ${{ github.event.pull_request.user.login }}
          OWNER_LOGIN: Aquaslopper
          EVENT_NAME: ${{ github.event_name }}
          BASE_REPO: ${{ github.repository }}
          HEAD_REPO: ${{ github.event.pull_request.head.repo.full_name }}
        run: |
          if [ -f tools/guard_protected.sh ]; then
            bash tools/guard_protected.sh
          elif [ "$EVENT_NAME" = "pull_request_target" ]; then
            echo "::error::tools/guard_protected.sh is missing from the reviewed base commit — the guard cannot run."
            echo "fail=true" >> "$GITHUB_OUTPUT"
          else
            echo "::notice::tools/guard_protected.sh is missing from this pull request — preview audit skipped."
            echo "fail=false" >> "$GITHUB_OUTPUT"
            echo "comment=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Sticky comment (protected zones, non-owner)
        if: steps.guard.outputs.comment == 'true'
        uses: marocchino/sticky-pull-request-comment@v2
        with:
          header: ${{ steps.guard.outputs.comment_header }}
          path: ${{ steps.guard.outputs.body }}

      - name: Fail on protected changes by a non-owner
        if: steps.guard.outputs.fail == 'true'
        env:
          PROTECTED_FILES: ${{ steps.guard.outputs.files }}
        run: |
          echo "Protected files changed:"
          printf '%s\n' "$PROTECTED_FILES" | tr ' ' '\n' | sed '/^$/d'
          echo "::error::Protected mechanics changed by a non-owner — owner review required (.github/CODEOWNERS). See docs/reference/protected-mechanics.md."
          exit 1
