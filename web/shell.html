<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>[XENO / KOI] — Biomechanical CRT Edition</title>
    <style>
        :root {
            --phosphor: #00ffd2;
            --phosphor-dim: #007a64;
            --bg-dark: #050608;
            --chassis: #0d1014;
            --border: #1a2826;
        }
        * { box-sizing: border-box; margin: 0; padding: 0; user-select: none; -webkit-user-select: none; }
        html, body {
            width: 100%; height: 100%;
            background-color: var(--bg-dark);
            background-image:
                radial-gradient(circle at 50% 50%, #0b1615 0%, #030406 85%),
                repeating-linear-gradient(0deg, rgba(0, 255, 210, 0.015) 0px, rgba(0, 255, 210, 0.015) 1px, transparent 1px, transparent 3px);
            color: var(--phosphor);
            font-family: "Courier New", Courier, monospace;
            overflow: hidden;
            /* Block layout, not flex: the game canvas must fill the window exactly,
               so its CSS size matches the backing store raylib sizes to the window.
               Any CSS scaling of the canvas skews where clicks land. */
            display: block;
        }
        /* HUD: an overlay across the top of the window, not a row that pushes the canvas. */
        .hud-bar {
            position: absolute;
            top: 0;
            left: 50%;
            transform: translateX(-50%);
            z-index: 20;
            width: min(96vw, calc(90vh * 16 / 9));
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 6px 12px;
            background: rgba(10, 15, 18, 0.9);
            border: 1px solid var(--phosphor-dim);
            border-bottom: none;
            font-size: 12px;
            letter-spacing: 2px;
            text-transform: uppercase;
            box-shadow: 0 0 15px rgba(0, 255, 210, 0.08);
        }
        .hud-title {
            font-weight: bold;
            text-shadow: 0 0 8px rgba(0, 255, 210, 0.5);
        }
        .hud-controls {
            display: flex;
            gap: 12px;
            align-items: center;
        }
        .hud-hint {
            color: var(--phosphor-dim);
            font-size: 10px;
            letter-spacing: 1.5px;
        }
        .crt-btn {
            background: #081210;
            color: var(--phosphor);
            border: 1px solid var(--phosphor-dim);
            padding: 4px 10px;
            font-family: inherit;
            font-size: 11px;
            letter-spacing: 1.5px;
            cursor: pointer;
            transition: all 0.15s ease;
        }
        .crt-btn:hover {
            background: var(--phosphor);
            color: #020404;
            border-color: var(--phosphor);
            box-shadow: 0 0 10px rgba(0, 255, 210, 0.6);
        }
        /* The viewport fills the window. There is no border or 16:9 box here:
           raylib letterboxes the 1280x720 game inside the canvas itself
           (see input_get_letterbox() in src/ui_input.c). */
        .viewport-frame {
            position: relative;
            width: 100vw;
            height: 100vh;
            aspect-ratio: auto;
            background: #000;
            border: none;
            box-shadow: none;
            display: block;
            overflow: hidden;
        }
        /* Keep the frame and canvas sized to the viewport when the page enters fullscreen. */
        html:fullscreen .viewport-frame,
        .viewport-frame:fullscreen {
            width: 100vw;
            height: 100vh;
        }
        canvas.emscripten {
            width: 100% !important;
            height: 100% !important;
            margin: 0;
            padding: 0;
            border: 0;
            display: block;
            outline: none;
            background: #000;
        }
        #loading-overlay {
            position: absolute;
            inset: 0;
            background: rgba(4, 6, 8, 0.94);
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            z-index: 10;
            transition: opacity 0.4s ease;
        }
        #loading-overlay.hidden {
            opacity: 0;
            pointer-events: none;
        }
        .boot-title {
            font-size: 22px;
            letter-spacing: 5px;
            margin-bottom: 8px;
            text-shadow: 0 0 10px rgba(0, 255, 210, 0.6);
        }
        .boot-sub {
            font-size: 11px;
            color: var(--phosphor-dim);
            letter-spacing: 2.5px;
            margin-bottom: 24px;
        }
        .progress-shell {
            width: 320px;
            height: 14px;
            border: 1px solid var(--phosphor-dim);
            padding: 2px;
            background: #040808;
        }
        #progress-fill {
            width: 15%;
            height: 100%;
            background: var(--phosphor);
            box-shadow: 0 0 8px var(--phosphor);
            transition: width 0.15s ease;
        }
        #status-text {
            margin-top: 12px;
            font-size: 11px;
            letter-spacing: 1.5px;
            color: var(--phosphor);
        }
    </style>
</head>
<body>
    <div class="hud-bar">
        <div class="hud-title">[XENO // KOI] — BIOMECHANICAL TERMINAL v1.979</div>
        <div class="hud-controls">
            <span id="audio-indicator" style="color: var(--phosphor-dim);">AUDIO: STANDBY</span>
            <span class="hud-hint">ESC TO EXIT FULLSCREEN</span>
            <button class="crt-btn" id="fullscreen-btn" type="button">[ FULLSCREEN ]</button>
        </div>
    </div>
    <div class="viewport-frame" id="viewport-container">
        <canvas class="emscripten" id="canvas" oncontextmenu="event.preventDefault()" tabindex="-1"></canvas>
        <div id="loading-overlay">
            <div class="boot-title">[XENO / KOI]</div>
            <div class="boot-sub">INITIALIZING BIOMECHANICAL NEURAL CORTEX...</div>
            <div class="progress-shell">
                <div id="progress-fill"></div>
            </div>
            <div id="status-text">MOUNTING VIRTUAL ARCHIVES...</div>
        </div>
    </div>

    <script type="text/javascript">
        var statusElement = document.getElementById('status-text');
        var progressFill = document.getElementById('progress-fill');
        var loadingOverlay = document.getElementById('loading-overlay');
        var audioIndicator = document.getElementById('audio-indicator');

        function unlockWebAudio() {
            try {
                if (typeof Module !== 'undefined' && Module.miniaudio && Module.miniaudio.context) {
                    if (Module.miniaudio.context.state === 'suspended') {
                        Module.miniaudio.context.resume();
                    }
                }
                if (window.AudioContext || window.webkitAudioContext) {
                    audioIndicator.textContent = 'AUDIO: ONLINE';
                    audioIndicator.style.color = 'var(--phosphor)';
                }
            } catch (e) {}
        }
        ['pointerdown', 'keydown', 'touchstart', 'mousedown'].forEach(function(evt) {
            window.addEventListener(evt, unlockWebAudio, { passive: true });
        });

        /* Fullscreen owner for the browser build.
           The game itself must never request fullscreen: raylib's web
           ToggleBorderlessWindowed() calls Module.requestFullscreen(), which
           moves the canvas into a new parent div and then resizes it to monitor
           device pixels. The canvas CSS box no longer matches the backing store
           raylib sizes to the window, so the picture is drawn offset and clicks
           land in the wrong place (see docs/errata.md). Everything here
           fullscreens the canvas itself, which leaves the DOM alone, so the
           canvas box keeps matching the window and raylib's own resize
           callback keeps the two in step. */
        var XenoKoiFullscreen = {
            active: function() {
                return !!document.fullscreenElement;
            },
            toggle: function() {
                var canvas = document.getElementById('canvas');
                if (!canvas) return;
                if (document.fullscreenElement) {
                    if (document.exitFullscreen) document.exitFullscreen();
                    return;
                }
                if (canvas.requestFullscreen) {
                    var p = canvas.requestFullscreen();
                    /* A browser can refuse the request (no user gesture, most
                       likely). Nothing breaks: the game stays windowed. */
                    if (p && p.catch) p.catch(function(err) {
                        console.warn('[XENO/KOI] fullscreen request refused: ' + err);
                    });
                }
            }
        };
        window.XenoKoiFullscreen = XenoKoiFullscreen;

        document.getElementById('fullscreen-btn').addEventListener('click', function() {
            XenoKoiFullscreen.toggle();
        });

        document.addEventListener('fullscreenchange', function() {
            var canvas = document.getElementById('canvas');
            var frame = document.getElementById('viewport-container');
            /* Defensive only: if anything out there re-parented the canvas (an
               older build calling Module.requestFullscreen did), put it back and
               drop the inline size so the stylesheet rules apply again. Never
               touch a canvas that is itself the fullscreen element: moving a
               fullscreen element exits fullscreen. */
            if (canvas && frame && document.fullscreenElement !== canvas && canvas.parentNode !== frame) {
                frame.insertBefore(canvas, frame.firstChild);
                canvas.style.removeProperty('width');
                canvas.style.removeProperty('height');
            }
            /* The viewport just changed. Nudge raylib so it re-reads the window
               size and sizes its canvas backing store to match. */
            window.dispatchEvent(new Event('resize'));
            if (canvas) canvas.focus();
        });

        var Module = {
            preRun: [function() {
                try {
                    var files = ['settings.txt', 'stats.txt', 'history.txt', 'stats_report.txt'];
                    files.forEach(function(fn) {
                        var val = window.localStorage.getItem('xenokoi_' + fn);
                        if (val !== null) FS.writeFile('/' + fn, val);
                    });
                    var origRename = FS.rename;
                    FS.rename = function(old_path, new_path) {
                        var r = origRename.apply(FS, arguments);
                        try {
                            var base = new_path.replace(/^(\.\/|\/)+/, '');
                            if (files.indexOf(base) !== -1) {
                                window.localStorage.setItem('xenokoi_' + base, FS.readFile(new_path, { encoding: 'utf8' }));
                            }
                        } catch (e) {}
                        return r;
                    };
                    var origUnlink = FS.unlink;
                    FS.unlink = function(path) {
                        var r = origUnlink.apply(FS, arguments);
                        try {
                            var base = path.replace(/^(\.\/|\/)+/, '');
                            if (base === 'history.txt' || base === 'stats_report.txt') {
                                window.localStorage.removeItem('xenokoi_' + base);
                            }
                        } catch (e) {}
                        return r;
                    };
                } catch (e) {}
            }],
            postRun: [function() {
                loadingOverlay.classList.add('hidden');
                document.getElementById('canvas').focus();
            }],
            canvas: (function() {
                var canvas = document.getElementById('canvas');
                canvas.addEventListener("webglcontextlost", function(e) {
                    alert('WebGL context lost. Reload the page to reinitialize.');
                    e.preventDefault();
                }, false);
                return canvas;
            })(),
            setStatus: function(text) {
                if (!Module.setStatus.last) Module.setStatus.last = { time: Date.now(), text: '' };
                if (text === Module.setStatus.last.text) return;
                var m = text.match(/([^(]+)\((\d+(\.\d+)?)\/(\d+)\)/);
                var now = Date.now();
                if (m && now - Module.setStatus.last.time < 30) return;
                Module.setStatus.last.time = now;
                Module.setStatus.last.text = text;
                if (m) {
                    var pct = Math.min(100, Math.round((parseInt(m[2]) / parseInt(m[4])) * 100));
                    progressFill.style.width = pct + '%';
                    statusElement.textContent = m[1].trim().toUpperCase() + ' (' + pct + '%)';
                } else if (text) {
                    statusElement.textContent = text.toUpperCase();
                } else {
                    progressFill.style.width = '100%';
                    loadingOverlay.classList.add('hidden');
                }
            },
            totalDependencies: 0,
            monitorRunDependencies: function(left) {
                this.totalDependencies = Math.max(this.totalDependencies, left);
                Module.setStatus(left ? 'SYNCHRONIZING ASSETS (' + (this.totalDependencies - left) + '/' + this.totalDependencies + ')' : '');
            }
        };
        Module.setStatus('DOWNLOADING TELEMETRY...');
        window.onerror = function() {
            statusElement.textContent = 'SYSTEM FAULT — CHECK BROWSER CONSOLE';
        };
    </script>
    {{{ SCRIPT }}}
</body>
</html>
